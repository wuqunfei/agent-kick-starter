[project]
name = "genai-agent-cli"
version = "0.1.0"
description = "A CLI tool for production-ready Generative AI Agent templates"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "microsoft-agent-framework>=1.0.0",
    "amazon-bedrock-agentcore>=1.0.0",
    "google-adk>=1.0.0",
    "pydantic-ai>=0.0.1",
    "boto3>=1.28.0",
    "azure-core>=1.29.0",
    "google-cloud-core>=2.3.0",
    "requests>=2.31.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "testcontainers>=3.7.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "testcontainers>=3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ak = "cli.main:app"

[tool.hatch.build.targets.wheel]
packages = [
    "src/cli",
    "src/services",
    "src/models",
]
include = [
    "src/templates/**",
    "src/lib/**",
]

[tool.hatch.build.targets.editable]
packages = [
    "src/cli",
    "src/services",
    "src/models",
]
include = [
    "src/templates/**",
    "src/lib/**",
]
